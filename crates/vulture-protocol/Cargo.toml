[package]
name = "vulture-protocol"
version = "0.1.0"
edition = "2021"
publish = false

[features]
transport-tests = []

[dependencies]
pbjson = "0.7"
pbjson-types = "0.7"
prost = "0.13"
serde = { version = "1", features = ["derive"] }
tonic = { version = "0.12", features = ["tls", "tls-native-roots"] }

[build-dependencies]
pbjson-build = "0.7"
prost-build = "0.13"
protoc-bin-vendored = "3"
tonic-build = "0.12"

[dev-dependencies]
serde_json = "1"
