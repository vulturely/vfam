[package]
name = "vulture-device-vault"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
keyring-core = "=1.0.1"
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
serde_json = "1"
vulture-chat-crypto = { path = "../vulture-chat-crypto" }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "=1.0.2", features = ["keychain"] }

[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { version = "=1.0.2", features = ["protected"] }

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "=1.0.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "=1.1.0"

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service-keyring-store = { version = "=1.0.1", features = ["crypto-rust", "vendored"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "android")'.dependencies.jni]
version = "0.21"
